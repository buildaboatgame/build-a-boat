<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Build a Boat - Blocky Edition</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#9fd8ff; --p:rgba(22,23,26,.74); --p2:rgba(62,64,70,.92); --line:rgba(255,255,255,.14); --dim:rgba(255,255,255,.66);
  --blue:#335fff; --green:#00b06f; --red:#ff4d4d; --gold:#ffc928;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){ --bg:#6fb4e6; --p:rgba(14,15,18,.8); } }
:root[data-theme="dark"]{ --bg:#6fb4e6; --p:rgba(14,15,18,.8); }
html{ height:100%; scroll-padding-top:env(safe-area-inset-top,0px); }
*{ box-sizing:border-box; }
body{ margin:0; height:100%; overflow:hidden; background:var(--bg); color:#fff;
  font-family:'Gotham SSm','Gotham','Source Sans Pro','Segoe UI',system-ui,-apple-system,Arial,sans-serif; font-weight:600;
  user-select:none; -webkit-user-select:none; touch-action:none; }
#app{ position:fixed; inset:0; }
#app canvas{ display:block; width:100%; height:100%; }
#hud{ position:fixed; inset:0; pointer-events:none; }
.panel{ background:var(--p); border-radius:8px; backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); pointer-events:auto; }
button{ font:inherit; color:inherit; cursor:pointer; border:0; pointer-events:auto; }
kbd{ background:rgba(255,255,255,.16); padding:1px 7px; border-radius:5px; font:inherit; font-size:11px; }

#overlay{ position:absolute; inset:0; overflow:hidden; pointer-events:none; }
.ntag{ position:absolute; left:0; top:0; text-align:center; white-space:nowrap; will-change:transform; }
.ntag .nm{ font-size:13px; text-shadow:0 0 4px #000,0 1px 2px #000; }
.ntag .bub{ display:none; background:#fff; color:#111; padding:6px 11px; border-radius:12px; font-size:13px; max-width:220px; white-space:normal; margin:0 auto 4px; box-shadow:0 2px 6px rgba(0,0,0,.35); }
#flash{ position:absolute; inset:0; pointer-events:none; box-shadow:inset 0 0 160px 50px rgba(255,0,0,.7); opacity:0; }
#flash.on{ animation:fl .7s ease-out; } @keyframes fl{ from{ opacity:1; } to{ opacity:0; } }

/* top-left */
#topBar{ position:absolute; left:calc(12px + env(safe-area-inset-left,0px)); top:calc(10px + env(safe-area-inset-top,0px)); display:flex; gap:8px; }
.tb{ width:44px; height:44px; border-radius:8px; background:var(--p); font-size:20px; display:grid; place-items:center; }
.tb:hover{ background:var(--p2); }
.tb.wide{ width:auto; height:40px; padding:0 14px; display:flex; align-items:center; gap:8px; font-size:16px; }
.tb.wide span{ font-size:13px; } .tb.wide kbd{ margin-left:2px; }
.lsq{ width:18px; height:18px; border:4px solid #fff; border-radius:4px; transform:rotate(18deg); display:block; }
#chat{ position:absolute; left:calc(12px + env(safe-area-inset-left,0px)); top:calc(64px + env(safe-area-inset-top,0px)); width:min(340px,72vw); pointer-events:auto; }
#chatLog{ height:168px; overflow-y:auto; padding:8px 10px; background:rgba(0,0,0,.4); border-radius:8px 8px 0 0; font-size:14px; line-height:1.4; text-shadow:0 1px 2px #000; transition:opacity .4s; scrollbar-width:none; }
#chatLog::-webkit-scrollbar{ display:none; }
#chat.idle #chatLog{ opacity:.4; }
.msg{ word-break:break-word; margin-bottom:1px; font-weight:600; } .msg.sys{ color:#ffd95a; font-style:italic; }
#chatIn{ width:100%; background:rgba(0,0,0,.6); border:0; color:#fff; padding:9px 10px; border-radius:0 0 8px 8px; font:inherit; font-size:14px; outline:none; }
#chatIn::placeholder{ color:rgba(255,255,255,.5); }
#statsCard{ position:absolute; left:calc(12px + env(safe-area-inset-left,0px)); top:calc(318px + env(safe-area-inset-top,0px)); width:230px; padding:10px 12px; }
#statsCard h4{ margin:0 0 6px; font-size:11px; letter-spacing:1.4px; color:var(--dim); }
.st{ display:grid; grid-template-columns:1fr auto; gap:2px 8px; margin-bottom:6px; font-size:12px; }
.bar{ grid-column:1 / -1; height:6px; border-radius:4px; background:rgba(255,255,255,.14); overflow:hidden; position:relative; }
.bar i{ display:block; height:100%; width:0; border-radius:4px; transition:width .25s; }
#chk{ display:flex; flex-direction:column; gap:2px; margin:6px 0; padding-top:6px; border-top:1px solid var(--line); font-size:12px; }
#chk .ok{ color:#5ff08a; } #chk .no{ color:#ffb347; }
#meter{ font-size:12px; } #meter .row{ display:flex; justify-content:space-between; margin-bottom:4px; } #mBar{ background:linear-gradient(90deg,#335fff,#7a4dff); }

/* top-right */
#rightCol{ position:absolute; right:calc(12px + env(safe-area-inset-right,0px)); top:calc(10px + env(safe-area-inset-top,0px)); width:260px; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
#plist{ width:100%; overflow:hidden; }
#plist.collapsed #plRows{ display:none; }
.ph{ padding:7px 12px; font-size:12px; color:var(--dim); display:grid; grid-template-columns:1fr 54px 60px; background:rgba(0,0,0,.28); }
.pr{ padding:6px 12px; display:grid; grid-template-columns:1fr 54px 60px; font-size:13px; align-items:center; }
.pr.me{ background:rgba(255,255,255,.12); } .pr .g{ color:var(--gold); }
.pr .nmc{ display:flex; align-items:center; gap:8px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.av{ width:18px; height:18px; border-radius:4px; flex:0 0 auto; }
#toasts{ display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
.toast{ width:250px; padding:10px 12px 10px 14px; background:var(--p); border-radius:8px; border-left:4px solid #8a8f98; font-size:13px; animation:slideIn .25s ease-out; transition:opacity .3s, transform .3s; pointer-events:auto; }
.toast.good{ border-color:#02b757; } .toast.bad{ border-color:#ff4d4d; } .toast.gold{ border-color:#ffc928; color:#ffd95a; }
.toast.out{ opacity:0; transform:translateX(40px); }
@keyframes slideIn{ from{ transform:translateX(120%); opacity:0; } to{ transform:none; opacity:1; } }

/* build dock */
#dock{ position:absolute; inset:0; pointer-events:none; }
#hotWrap{ position:absolute; left:50%; bottom:calc(12px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:8px; max-width:98vw; }
#tip{ padding:7px 14px; font-size:13px; display:flex; gap:10px; align-items:center; flex-wrap:wrap; justify-content:center; max-width:90vw; }
#tip .d{ color:var(--dim); } #tip .chip{ font-size:11px; padding:1px 8px; border-radius:20px; background:rgba(255,255,255,.14); }
#palette{ display:none; gap:6px; padding:6px 8px; background:var(--p); border-radius:8px; pointer-events:auto; }
#palette.show{ display:flex; }
.sw{ width:24px; height:24px; border-radius:6px; border:2px solid rgba(255,255,255,.3); }
.sw.sel{ border-color:#fff; transform:scale(1.15); }
#hotbar{ display:flex; gap:6px; max-width:98vw; overflow-x:auto; padding:2px; }
.hb{ flex:0 0 auto; width:62px; height:62px; border-radius:8px; background:rgba(40,42,46,.8); border:2px solid rgba(255,255,255,.16); position:relative;
  display:flex; flex-direction:column; align-items:center; justify-content:center; pointer-events:auto; cursor:pointer; font-size:9px; }
.hb:hover{ background:rgba(70,73,80,.9); }
.hb.sel{ border-color:#fff; background:rgba(88,92,100,.92); }
.hb img{ width:36px; height:36px; } .hb .emo{ font-size:25px; line-height:36px; }
.hb .n{ position:absolute; left:5px; top:3px; font-size:11px; opacity:.85; } .hb .nm{ opacity:.85; }
#bpanel{ position:absolute; left:50%; bottom:calc(122px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); width:min(580px,94vw); padding:12px; display:none; }
#bpanel.show{ display:block; }
.bph{ display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; }
#bpSearch{ background:rgba(0,0,0,.4); border:1px solid var(--line); color:#fff; padding:6px 10px; border-radius:6px; font:inherit; font-size:13px; outline:none; width:160px; }
#bpGrid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(78px,1fr)); gap:8px; max-height:220px; overflow-y:auto; }
.bp{ height:84px; border-radius:8px; background:rgba(60,62,68,.9); border:2px solid transparent; display:flex; flex-direction:column; align-items:center; justify-content:center; font-size:11px; cursor:pointer; pointer-events:auto; }
.bp:hover{ border-color:#fff; } .bp img{ width:44px; height:44px; } .bp .emo{ font-size:30px; line-height:44px; }
#actions{ position:absolute; left:calc(12px + env(safe-area-inset-left,0px)); bottom:calc(12px + env(safe-area-inset-bottom,0px)); display:flex; flex-direction:column; gap:8px; }
#bLaunch{ position:absolute; right:calc(12px + env(safe-area-inset-right,0px)); bottom:calc(12px + env(safe-area-inset-bottom,0px)); padding:14px 24px; border-radius:10px; font-size:16px; font-weight:800; color:#032b14;
  background:linear-gradient(180deg,#2fe27f,#02b757); box-shadow:0 4px 0 #017a3b; }
#bLaunch:active{ transform:translateY(3px); box-shadow:0 1px 0 #017a3b; }
#hp{ position:absolute; right:calc(14px + env(safe-area-inset-right,0px)); bottom:calc(86px + env(safe-area-inset-bottom,0px)); width:200px; display:none; font-size:11px; color:var(--dim); }
#hp.show{ display:block; }
.hpbar{ height:14px; background:rgba(0,0,0,.55); border-radius:8px; overflow:hidden; border:2px solid rgba(255,255,255,.35); margin-top:3px; }
#hpFill{ display:block; height:100%; width:100%; background:#4cd964; transition:width .15s; }

/* sail */
#sail{ position:absolute; left:50%; bottom:calc(14px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); display:none; flex-direction:column; align-items:center; gap:10px; width:min(540px,94vw); }
#gauge{ padding:8px 26px; text-align:center; } #spd{ font-size:32px; line-height:1; font-weight:800; } #gauge small{ color:var(--dim); font-size:11px; letter-spacing:1px; }
#track{ width:100%; padding:12px 14px 8px; } #track .bar{ height:10px; overflow:visible; }
#progFill{ background:linear-gradient(90deg,#00a2ff,#02b757); }
.tick{ position:absolute; top:-3px; width:3px; height:16px; background:#fff; border-radius:2px; opacity:.85; }
#boatDot{ position:absolute; top:-9px; width:26px; height:26px; margin-left:-13px; font-size:20px; line-height:26px; text-align:center; }
#track .lbl{ display:flex; justify-content:space-between; margin-top:8px; font-size:11px; color:var(--dim); }
#fireRow{ padding:8px 14px; display:none; align-items:center; gap:12px; width:260px; font-size:12px; } #fireRow .bar{ flex:1; } #reload{ background:var(--gold); }
#sailBtns{ display:flex; gap:8px; }
.big{ padding:12px 22px; border-radius:10px; background:#335fff; font-size:14px; font-weight:800; box-shadow:0 3px 0 #1f3db3; }
.big.fire{ background:var(--gold); color:#4a3200; box-shadow:0 3px 0 #b8870a; }
#pad{ position:absolute; left:calc(14px + env(safe-area-inset-left,0px)); bottom:calc(100px + env(safe-area-inset-bottom,0px)); display:none; grid-template-columns:repeat(3,52px); grid-template-rows:repeat(2,52px); gap:6px; }
#pad button{ border-radius:50%; background:var(--p2); font-size:18px; }
#jumpBtn{ position:absolute; right:calc(18px + env(safe-area-inset-right,0px)); bottom:calc(150px + env(safe-area-inset-bottom,0px)); width:70px; height:70px; border-radius:50%; background:var(--p2); font-size:26px; display:none; }

/* emotes */
#emotes{ position:absolute; inset:0; display:none; place-items:center; background:rgba(0,0,0,.3); pointer-events:auto; }
.wheel{ position:relative; width:310px; height:310px; border-radius:50%; background:var(--p); }
.wheel .ctr{ position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); font-size:12px; color:var(--dim); text-align:center; }
.em{ position:absolute; left:50%; top:50%; width:78px; height:78px; margin:-39px; border-radius:50%; background:var(--p2); font-size:28px; display:grid; place-items:center; }
.em small{ display:block; font-size:10px; margin-top:-4px; } .em:hover{ background:#335fff; }

/* menu */
#menu{ position:absolute; inset:0; display:none; place-items:center; background:rgba(0,0,0,.55); pointer-events:auto; z-index:20; }
#menu.show{ display:grid; }
.mbox{ width:min(780px,94vw); background:rgba(30,31,36,.97); border-radius:12px; overflow:hidden; box-shadow:0 10px 40px rgba(0,0,0,.5); }
.mtabs{ display:flex; background:rgba(0,0,0,.35); } .mtabs button{ flex:1; padding:14px 8px; background:none; font-size:14px; border-bottom:3px solid transparent; color:var(--dim); }
.mtabs button.on{ color:#fff; border-color:#fff; background:rgba(255,255,255,.06); }
#mbody{ height:min(360px,52vh); overflow:auto; padding:16px 22px; font-size:14px; }
.mfoot{ display:flex; gap:10px; padding:14px 18px; background:rgba(0,0,0,.3); }
.mfoot button{ flex:1; padding:12px; border-radius:8px; background:rgba(255,255,255,.1); font-size:14px; } .mfoot button:hover{ background:rgba(255,255,255,.2); }
.mfoot .pri{ background:#fff; color:#111; } .mfoot u{ text-decoration:underline; }
.set{ display:grid; grid-template-columns:1fr 1.3fr auto; gap:14px; align-items:center; margin-bottom:14px; }
.set input[type=range]{ width:100%; } .set select, .set .tg{ background:rgba(255,255,255,.12); color:#fff; border:0; padding:6px 10px; border-radius:6px; font:inherit; }
.set .tg.on{ background:#02b757; }
.mrow{ display:flex; align-items:center; gap:12px; padding:8px 0; border-bottom:1px solid var(--line); } .mrow .g{ margin-left:auto; color:var(--gold); }
.swrow{ display:flex; gap:8px; flex-wrap:wrap; margin:6px 0 16px; } .swrow .sw{ width:30px; height:30px; }
.helpg{ display:grid; grid-template-columns:1fr 1fr; gap:4px 24px; } .helpg div{ display:flex; justify-content:space-between; padding:7px 0; border-bottom:1px solid var(--line); }

/* loading + leave */
#loading, #leave{ position:absolute; inset:0; background:#16181d; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; pointer-events:auto; z-index:50; transition:opacity .5s; text-align:center; padding:20px; }
#leave{ display:none; z-index:40; } #loading h1, #leave h1{ margin:0; font-size:34px; letter-spacing:3px; }
.spin{ width:46px; height:46px; border:5px solid rgba(255,255,255,.2); border-top-color:#fff; border-radius:50%; animation:sp 1s linear infinite; } @keyframes sp{ to{ transform:rotate(360deg); } }
#lbar{ width:min(320px,70vw); height:8px; background:rgba(255,255,255,.15); border-radius:6px; overflow:hidden; } #lbar i{ display:block; height:100%; width:0; background:#fff; transition:width .2s; }
#ltip{ color:var(--dim); font-size:14px; max-width:420px; } #bRejoin{ padding:12px 34px; border-radius:10px; background:#fff; color:#111; font-size:16px; font-weight:800; }

@media (max-width:760px){ #statsCard{ display:none; } #rightCol{ width:200px; } .toast{ width:200px; } .ph,.pr{ grid-template-columns:1fr 44px 52px; } .hb{ width:54px; height:56px; } #tip .d{ display:none; } .tb.wide span, .tb.wide kbd{ display:none; } }
@media (max-height:720px){ #statsCard{ display:none; } }

#wet{ position:absolute; inset:0; background:rgba(20,100,180,.3); opacity:0; transition:opacity .3s; pointer-events:none; }
#wet.on{ opacity:1; }
.avwrap{ display:flex; gap:20px; align-items:flex-start; }
#avPrev{ width:180px; height:260px; border-radius:10px; background:linear-gradient(#5aa9e6,#2f6fb0); flex:0 0 auto; overflow:hidden; }
#avPrev canvas{ display:block; }
.avopts{ flex:1; min-width:0; }
.nameIn{ width:100%; background:rgba(255,255,255,.12); border:0; color:#fff; padding:8px 10px; border-radius:6px; font:inherit; margin:6px 0 14px; outline:none; }
.chipb{ padding:6px 12px; border-radius:20px; background:rgba(255,255,255,.12); font-size:12px; }
.chipb.sel{ background:#fff; color:#111; }
@media (max-width:760px){ .avwrap{ flex-direction:column; } }

.tb.wide.on{ background:#335fff; }
#wbar{ display:none; gap:6px; max-width:98vw; overflow-x:auto; padding:2px; }

#bCloud{ opacity:.4; } #bCloud.on{ opacity:1; color:#7fe0ff; } #bCloud.sync{ color:#5ff08a; }
.ntag .role{ font-size:12px; color:#5fe6ff; text-shadow:0 0 4px #000,0 1px 2px #000; margin-bottom:1px; }
.ntag .role:empty{ display:none; }
#prompt{ pointer-events:auto; } #prompt.go{ background:#02b757; box-shadow:0 3px 0 #017a3b; }
#sitBtn{ position:absolute; left:50%; bottom:calc(150px + env(safe-area-inset-bottom,0px)); transform:translateX(-50%); pointer-events:auto; } #sitBtn.go{ background:#02b757; box-shadow:0 3px 0 #017a3b; }
.mpcode{ font:800 38px/1.1 monospace; letter-spacing:6px; text-align:center; padding:14px; background:rgba(255,255,255,.1); border-radius:10px; margin:10px 0; user-select:text; -webkit-user-select:text; }
#roomChip{ padding:6px 12px; font-size:12px; cursor:pointer; text-align:center; width:100%; }
</style>
</head>
<body>
<div id="app"></div>
<div id="hud">
  <div id="overlay"></div>
  <div id="flash"></div>
  <div id="wet"></div>

  <div id="topBar">
    <button class="tb" id="bMenu" title="Menu (Esc)"><i class="lsq"></i></button>
    <button class="tb" id="bChatBtn" title="Chat">&#128172;</button>
    <button class="tb" id="bEmote" title="Emotes (.)">&#128515;</button>
    <button class="tb" id="bTogether" title="Play with friends (room code)">&#128101;</button>
    <button class="tb" id="bCloud" title="Cloud save">&#9729;</button>
  </div>

  <div id="chat" class="idle"><div id="chatLog"></div><input id="chatIn" maxlength="200" placeholder="To chat click here or press / key" autocomplete="off"></div>

  <div id="statsCard" class="panel">
    <h4>BOAT STATS</h4>
    <div class="st"><span>Weight</span><b id="vW">0</b><div class="bar"><i id="bW" style="background:#ff9f43"></i></div></div>
    <div class="st"><span>Power</span><b id="vP">0</b><div class="bar"><i id="bP" style="background:#ff5d5d"></i></div></div>
    <div class="st"><span>Top speed</span><b id="vS">0</b><div class="bar"><i id="bS" style="background:#00a2ff"></i></div></div>
    <div class="st"><span>Handling</span><b id="vH">0</b><div class="bar"><i id="bH" style="background:#a16bff"></i></div></div>
    <div class="st"><span>Armor</span><b id="vA">0</b><div class="bar"><i id="bA" style="background:#9aa0aa"></i></div></div>
    <div id="chk"></div>
    <div id="meter"><div class="row"><span>Blocks</span><span id="mTxt">0/150</span></div><div class="bar"><i id="mBar"></i></div></div>
  </div>

  <div id="rightCol">
    <div id="plist" class="panel"><div class="ph"><span>Players</span><span>Gold</span><span>Stage</span></div><div id="plRows"></div></div>
    <div id="roomChip" class="panel" style="display:none"></div>
    <div id="toasts"></div>
  </div>

  <div id="dock">
    <div id="hotWrap">
      <div id="tip" class="panel"></div>
      <div id="palette"></div>
      <div id="hotbar"></div>
      <div id="wbar"></div>
    </div>
    <div id="bpanel" class="panel"><div class="bph"><b>Backpack</b><input id="bpSearch" placeholder="Search" autocomplete="off"></div><div id="bpGrid"></div></div>
    <button class="big" id="sitBtn" style="display:none"></button>
    <div id="actions">
      <button class="tb wide" id="bWorld">&#127757;<span>Edit World</span><kbd>M</kbd></button>
      <button class="tb wide" id="bBackpack">&#127890;<span>Backpack</span><kbd>`</kbd></button>
      <button class="tb wide" id="bUndo">&#8630;<span>Undo</span><kbd>Z</kbd></button>
      <button class="tb wide" id="bClear">&#128465;<span>Clear all</span></button>
    </div>
    <button id="bLaunch">&#9654; LAUNCH BOAT</button>
  </div>

  <div id="hp"><span>Health</span><div class="hpbar"><i id="hpFill"></i></div></div>

  <div id="sail">
    <div id="gauge" class="panel"><div id="spd">0</div><small>STUDS / SEC</small><small id="bcount" style="display:block;margin-top:2px"></small><small id="miles" style="display:block;margin-top:2px;color:var(--dim)"></small></div>
    <div id="track" class="panel"><div class="bar"><i id="progFill"></i><span id="boatDot">&#9973;</span></div><div class="lbl"><span>Start</span><span>Treasure</span></div></div>
    <div id="fireRow" class="panel"><span>Cannons</span><div class="bar"><i id="reload"></i></div></div>
    <button class="big" id="prompt" style="display:none"></button><div id="sailBtns"><button class="big fire" id="bFire" style="display:none">FIRE (Space)</button><button class="big" id="bBack">Back to build (B)</button></div>
  </div>

  <div id="pad"><span></span><button data-k="w">&#9650;</button><span></span><button data-k="a">&#9664;</button><button data-k="s">&#9660;</button><button data-k="d">&#9654;</button></div>
  <button id="jumpBtn">&#9650;</button>

  <div id="emotes"><div class="wheel" id="wheel"><div class="ctr">Emotes<br>(click outside to close)</div></div></div>

  <div id="menu"><div class="mbox">

function makeScenery(zA, zB, seed, forSpawn){
  const Rg = rng(seed * 7919 + 17), r = () => Rg(), len = zB - zA;
  const g = new T.Group(), dummy = new T.Object3D(), col = new T.Color();
  const skip = (x, z) => forSpawn && ((Math.abs(x) < 128 && z > 52 && z < 248) || z > 276);
  const NTR = Math.round(len * 3), NTU = Math.round(len * 1.6), NFL = Math.round(len * .27);
  const trunks = new T.InstancedMesh(new T.BoxGeometry(1, 1, 1), trunkMat, NTR), cones = new T.InstancedMesh(new T.ConeGeometry(1, 1, 7), coneMat, NTR * 2);
  let n = 0;
  while (n < NTR){
    const sd = r() < .5 ? -1 : 1, x = sd * (30 + r() * 308), z = zA + r() * len;
    if (skip(x, z)) continue;
    const s = .8 + r() * 1.1, shade = .75 + r() * .5;
    dummy.rotation.set(0, 0, 0); dummy.position.set(x, 1.5 * s, z); dummy.scale.set(s, 3 * s, s); dummy.updateMatrix(); trunks.setMatrixAt(n, dummy.matrix);
    for (let k = 0; k < 2; k++){
      const rr = (4.2 - k * 1.5) * s, h = (8 - k * 2) * s;
      dummy.position.set(x, 3 * s + h / 2 + k * 3.2 * s, z); dummy.scale.set(rr, h, rr); dummy.updateMatrix(); cones.setMatrixAt(n * 2 + k, dummy.matrix);
      col.setRGB(.12 * shade, .38 * shade, .16 * shade); cones.setColorAt(n * 2 + k, col);
    }
    n++;
  }
  [trunks, cones].forEach(m => { m.instanceMatrix.needsUpdate = true; m.frustumCulled = false; g.add(m); });
  if (cones.instanceColor) cones.instanceColor.needsUpdate = true;
  const onPad = (x, z) => forSpawn && LOT_Z.some(lz => Math.abs(Math.abs(x) - 42) < 13 && Math.abs(z - lz) < 13);
  const scatter = (mesh, count, y) => {
    let i = 0;
    while (i < count){
      const sd = r() < .5 ? -1 : 1, x = sd * (27 + r() * 311), z = zA + r() * len;
      if (skip(x, z) || onPad(x, z)) continue;
      dummy.rotation.set(0, r() * 3, 0); dummy.position.set(x, y, z); dummy.scale.setScalar(.7 + r() * .8); dummy.updateMatrix(); mesh.setMatrixAt(i++, dummy.matrix);
    }
    mesh.instanceMatrix.needsUpdate = true; mesh.frustumCulled = false; g.add(mesh);
  };
  scatter(new T.InstancedMesh(new T.ConeGeometry(.45, 1.3, 4), tuftMat, NTU), NTU, .6);
  scatter(new T.InstancedMesh(new T.BoxGeometry(.5, .5, .5), flwMat, NFL), NFL, .3);
  const hill = (x, z) => { const rr = 24 + r() * 20, h = 18 + r() * 34, m = new T.Mesh(new T.ConeGeometry(rr, h, 6), hillMat); m.position.set(x, h / 2 - 1, z); m.rotation.y = r() * 3; g.add(m); };
  for (let z = zA; z < zB; z += 36) [-1, 1].forEach(sd => { const zz = z + r() * 12; if (forSpawn && zz > 36 && zz < 262) return; hill(sd * (290 + r() * 14), zz); });
  for (let i = 0, nh = Math.round(len * .03); i < nh; i++){ const sd = r() < .5 ? -1 : 1, x = sd * (70 + r() * 220), z = zA + r() * len; if (forSpawn && Math.abs(x) < 130 && z > 36 && z < 262) continue; hill(x, z); }
  return g;
}

const treeTrunkMat = new T.MeshLambertMaterial({ color: 0x7a5230 }), treeLeafMat = new T.MeshLambertMaterial({ color: 0x3f8f2b });

function buildObject(o){
  if (o.t === 'wall' || o.t === 'mover') o = { t: 'rock', x: o.x, z: o.z, r: 3 };   // old saves: walls and sliders become rocks
  let mesh, ref = null;
  const sy = surfaceY(o.z);
  if (o.t === 'rock'){
    const r = o.r || 2.5;
    mesh = new T.Mesh(new T.IcosahedronGeometry(r, 0), rockMat); mesh.position.set(o.x, r * .35 - .4 + sy, o.z);
    mesh.rotation.set(Math.random() * 3, Math.random() * 3, Math.random() * 3);
    ref = { x: o.x, z: o.z, r: r * .95, mesh, dead: false }; rocks.push(ref);
  } else if (o.t === 'wall'){
    const w = o.w || 8;
    mesh = new T.Mesh(new T.BoxGeometry(w, 8, 4), [brickMat, brickMat, new T.MeshLambertMaterial({ map: studTex('#b5523b', 4, Math.max(1, w / 4), 1) }), brickMat, brickMat, brickMat]);
    mesh.position.set(o.x, 3.6 + sy, o.z); ref = [o.x - w / 2, o.x + w / 2, o.z - 2, o.z + 2]; aabbs.push(ref);
  } else if (o.t === 'mover'){
    const w = o.w || 14;
    mesh = new T.Mesh(new T.BoxGeometry(w, 8, 3), new T.MeshLambertMaterial({ color: 0xd04848 })); mesh.position.set(o.x, 3.6 + sy, o.z);
    ref = { mesh, box: [o.x - w / 2, o.x + w / 2, o.z - 1.5, o.z + 1.5], x0: o.x, z: o.z, w, amp: o.amp || 12, ph: o.ph || 0 };
    movers.push(ref); aabbs.push(ref.box);
  } else if (o.t === 'spike'){
    mesh = new T.Group();
    const sp = new T.Mesh(new T.ConeGeometry(1.3, 4.4, 8), spikeMat); sp.position.y = 1.9; mesh.add(sp);
    const tip = new T.Mesh(new T.ConeGeometry(.45, 1.1, 8), new T.MeshBasicMaterial({ color: 0xff4040 })); tip.position.y = 4.3; mesh.add(tip);
    mesh.position.set(o.x, WATER_Y + sy, o.z); ref = { x: o.x, z: o.z, r: 1.3 }; spikes.push(ref);
  } else if (o.t === 'tree'){
    mesh = new T.Group();
    const tr = new T.Mesh(new T.BoxGeometry(1.2, 4, 1.2), treeTrunkMat); tr.position.y = 2; mesh.add(tr);
    const lf = new T.Mesh(new T.BoxGeometry(4.5, 4.5, 4.5), treeLeafMat); lf.position.y = 6; mesh.add(lf);
    mesh.position.set(o.x, 0, o.z);
  } else {
    mesh = new T.Group();
    const a = new T.Mesh(new T.CylinderGeometry(.9, .9, 1.4, 12), new T.MeshLambertMaterial({ color: 0xe8453c })); a.position.y = .7; mesh.add(a);
    const b = new T.Mesh(new T.CylinderGeometry(.92, .92, .5, 12), new T.MeshLambertMaterial({ color: 0xffffff })); b.position.y = .75; mesh.add(b);
    const c = new T.Mesh(new T.ConeGeometry(.6, 1.2, 12), new T.MeshLambertMaterial({ color: 0xe8453c })); c.position.y = 2; mesh.add(c);
    mesh.position.set(o.x, WATER_Y - .3 + sy, o.z);
  }
  scene.add(mesh);
  const ent = { o, mesh, ref }; world.push(ent); return ent;
}
function removeObject(ent){
  scene.remove(ent.mesh); const r = ent.ref;
  if (r){
    let i = rocks.indexOf(r); if (i >= 0) rocks.splice(i, 1);
    i = aabbs.indexOf(r); if (i >= 0) aabbs.splice(i, 1);
    i = spikes.indexOf(r); if (i >= 0) spikes.splice(i, 1);
    i = movers.indexOf(r); if (i >= 0){ movers.splice(i, 1); i = aabbs.indexOf(r.box); if (i >= 0) aabbs.splice(i, 1); }
  }
  const k = world.indexOf(ent); if (k >= 0) world.splice(k, 1);
}

// ---- course rocks stream in around the boat (96-stud chunks, the same rocks every time)
const RCH = 96, ROCK_Z0 = -110, rockChunks = new Map();
const CH_MAX = Math.floor((ROCK_Z0 - (FALL_TOP + 90)) / RCH);
const rockGeoTab = [2, 2.7, 3.4, 4].map(rr => ({ r: rr, geo: new T.IcosahedronGeometry(rr, 0) }));
function loadRockChunk(ci){
  const R = rng(ci * 7919 + 101), r = () => R(), list = [], zTop = ROCK_Z0 - ci * RCH;
  const seg = clamp(Math.floor((CS - zTop) / CP_GAP), 0, N_CP - 1), dens = .3 + .55 * (seg / Math.max(1, N_CP - 1));
  const add = (x, z, rr) => {
    const t = rockGeoTab.reduce((a, b) => Math.abs(b.r - rr) < Math.abs(a.r - rr) ? b : a);
    const mesh = new T.Mesh(t.geo, rockMat); mesh.scale.setScalar(rr / t.r); mesh.position.set(x, rr * .35 - .4, z); mesh.rotation.set(r() * 3, r() * 3, r() * 3); scene.add(mesh);
    const ref = { x, z, r: rr * .95, mesh, dead: false }; rocks.push(ref); list.push(ref);
  };
  for (let z = zTop; z > zTop - RCH; z -= 5){
    if (r() > dens) continue;
    const n = r() < .35 ? 2 : 1;
    for (let k = 0; k < n; k++) add((r() * 2 - 1) * 19, z - r() * 4, 2 + r() * 1.6);
  }
  if (r() < .42){
    const z = zTop - 10 - r() * (RCH - 20), gaps = [(r() * 2 - 1) * 14, (r() * 2 - 1) * 14];
    for (let x = -22; x <= 22; x += 5.5){ if (gaps.some(g => Math.abs(x - g) < 7)) continue; add(x, z, 2.6); }
  }
  rockChunks.set(ci, list);
}
function unloadRockChunk(ci){
  const list = rockChunks.get(ci); if (!list) return;
  list.forEach(k => { scene.remove(k.mesh); const i = rocks.indexOf(k); if (i >= 0) rocks.splice(i, 1); });
  rockChunks.delete(ci);
}
function streamRocks(zf){
  const lo = Math.max(0, Math.floor((ROCK_Z0 - (zf + 700)) / RCH)), hi = Math.min(CH_MAX, Math.floor((ROCK_Z0 - (zf - 1100)) / RCH));
  [...rockChunks.keys()].forEach(ci => { if (ci < lo || ci > hi) unloadRockChunk(ci); });
  for (let ci = lo; ci <= hi; ci++) if (!rockChunks.has(ci)) loadRockChunk(ci);
}

function addCell(x, y, z, type, color, opts = {}){
  const col = BLOCKS[type].paint ? (color || BLOCKS[type].color) : BLOCKS[type].color;
  const obj = makeBlock(type, col); const key = keyOf(x,y,z); obj.userData.key = key;

}
function removeCell(key, rec){
  const c = cells.get(key); if (!c) return;
  if (rec) pushUndo({ op: 'del', d: { x: c.x, y: c.y, z: c.z, type: c.type, color: c.color } });
  boat.remove(c.obj); cells.delete(key); refresh();
}
function recolor(key, color, rec){
  const c = cells.get(key); if (!c) return;

  const pos = c.obj.position.clone(); boat.remove(c.obj);
  c.color = color; c.obj = makeBlock(c.type, color); c.obj.userData.key = key; c.obj.position.copy(pos); boat.add(c.obj); refresh();

function undo(){

  else if (o.op === 'del') addCell(o.d.x, o.d.y, o.d.z, o.d.type, o.d.color);

  const top = [[32,8],[56,20],[32,32],[8,20]], left = [[8,20],[32,32],[32,58],[8,46]], right = [[32,32],[56,20],[56,46],[32,58]];
  const cube = (base) => {
    poly(left, base); poly(right, base); poly(top, base); poly(top, 'rgba(255,255,255,.3)'); poly(right, 'rgba(0,0,0,.28)'); poly(left, 'rgba(0,0,0,.08)');

  };

  if (type === 'Barrel'){

    if (type === 'Metal' || type === 'Cannon'){ [[37,38],[52,30],[37,54],[52,46],[13,29],[27,37]].forEach(p => circ(p[0], p[1], 2, 'rgba(0,0,0,.45)')); }
    if (type === 'Glass'){ poly([[40,26],[48,22],[40,48],[34,50]], 'rgba(255,255,255,.4)'); }
    if (type === 'Seat'){ poly([[32,12],[50,21],[32,30],[14,21]], 'rgba(255,255,255,.4)'); }

    if (type === 'Rudder'){ poly([[40,44],[60,34],[60,58],[40,58]], '#2c6a75'); }
    if (type === 'Cannon'){ circ(20, 38, 9, '#111'); circ(20, 38, 5, '#000'); x.strokeStyle = '#c9a227'; x.lineWidth = 2; x.beginPath(); x.arc(20, 38, 9, 0, 7); x.stroke(); }

function audio(){ if (!AC){ try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch(e){} } if (AC && AC.state === 'suspended') AC.resume(); return AC; }
function tone(f, d, type, v, f2){
  const a = audio(); if (!a || cfg.vol <= 0) return;
  const o = a.createOscillator(), g = a.createGain(); o.type = type || 'square';
  o.frequency.setValueAtTime(f, a.currentTime); if (f2) o.frequency.exponentialRampToValueAtTime(f2, a.currentTime + d);
  g.gain.setValueAtTime((v || .1) * cfg.vol, a.currentTime); g.gain.exponentialRampToValueAtTime(.0001, a.currentTime + d);
  o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime + d);
}
function noise(d, v){
  const a = audio(); if (!a || cfg.vol <= 0) return;
  const n = Math.floor(a.sampleRate * d), buf = a.createBuffer(1, n, a.sampleRate), ch = buf.getChannelData(0);
  for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * (1 - i / n);
  const s = a.createBufferSource(), g = a.createGain(); s.buffer = buf; g.gain.value = (v || .2) * cfg.vol; s.connect(g); g.connect(a.destination); s.start();
}

function updateBalls(dt){
  for (let i = balls.length - 1; i >= 0; i--){
    const b = balls[i]; b.life -= dt; b.m.position.x += b.vx * dt; b.m.position.z += b.vz * dt; b.m.position.y -= dt * 2;
    const px = b.m.position.x, pz = b.m.position.z; let dead = b.life <= 0;
    for (const k of rocks){ if (!k.dead && Math.hypot(px - k.x, pz - k.z) < k.r + .6){ k.dead = true; k.mesh.visible = false; gold += 5; refresh(); toast('Rock destroyed! +5 gold', 'gold'); dead = true; break; } }
    if (!dead) for (const a of aabbs){ if (px > a[0] && px < a[1] && pz > a[2] && pz < a[3]){ dead = true; break; } }
    if (!dead) for (const L of logs){ const dx = Math.cos(L.ang), dz = -Math.sin(L.ang); const t = clamp(px * dx + (pz - L.cz) * dz, -L.half, L.half); if (Math.hypot(px - dx*t, pz - (L.cz + dz*t)) < 1.8){ dead = true; break; } }

function pushOut(nx, nz, pen, pvx, pvz){
  S.x += nx * pen; S.z += nz * pen;
  const rvx = S.vx - pvx, rvz = S.vz - pvz, vn = rvx * nx + rvz * nz;
  if (vn < 0){
    S.vx -= vn * nx; S.vz -= vn * nz;
    if (vn < -1.5){ S.vx *= S.retain; S.vz *= S.retain; S.yr *= .3; S.shake = Math.max(S.shake, clamp(-vn / 8, .15, 1)); damage(clamp((-vn - 1.5) * 1.6 * (1 - clamp(S.armor * .04, 0, .6)), 1, 40)); sfx('hit'); hitBoat(nx, nz, -vn); }
  }
}
function collide(){
  const R = S.R;
  for (const k of spikes){
    const dx = S.x - k.x, dz = S.z - k.z, d = Math.hypot(dx, dz);
    if (d < R + k.r && d > 1e-4){
      pushOut(dx/d, dz/d, R + k.r - d, 0, 0);
      if (S.spike <= 0){ S.spike = .7; damage(30); sfx('hit'); S.shake = Math.max(S.shake, .8); hitBoat(dx/d, dz/d, 12); }
    }
  }
  for (const b of aabbs){
    const P = lotWater(S.x, S.z) ? softPush : pushOut;
    const cx = clamp(S.x, b[0], b[1]), cz = clamp(S.z, b[2], b[3]);
    const dx = S.x - cx, dz = S.z - cz, d2 = dx*dx + dz*dz;
    if (d2 < R*R){
      if (d2 > 1e-6){ const d = Math.sqrt(d2); P(dx/d, dz/d, R - d, 0, 0); }
      else { const l = S.x - b[0], r = b[1] - S.x, t = S.z - b[2], u = b[3] - S.z, m = Math.min(l, r, t, u);
        if (m === l) P(-1, 0, l + R, 0, 0); else if (m === r) P(1, 0, r + R, 0, 0); else if (m === t) P(0, -1, t + R, 0, 0); else P(0, 1, u + R, 0, 0); }
    }
  }
  for (const k of rocks){
    if (k.dead) continue;
    const dx = S.x - k.x, dz = S.z - k.z, d = Math.hypot(dx, dz);
    if (d < R + k.r && d > 1e-4) smashRock(k, dx/d, dz/d);
  }
  for (const L of logs){
    const dirx = Math.cos(L.ang), dirz = -Math.sin(L.ang);
    const t = clamp(S.x * dirx + (S.z - L.cz) * dirz, -L.half, L.half);
    const px = dirx * t, pz = L.cz + dirz * t;
    const dx = S.x - px, dz = S.z - pz, d = Math.hypot(dx, dz);
    if (d < R + .9 && d > 1e-4) pushOut(dx/d, dz/d, R + .9 - d, L.w * (pz - L.cz), -L.w * px);
  }
}

function updateSail(dt, t){
  movers.forEach(m => { const mx = m.x0 + Math.sin(t * .9 + m.ph) * m.amp; m.mesh.position.x = mx; m.box[0] = mx - m.w / 2; m.box[1] = mx + m.w / 2; m.box[2] = m.z - 1.5; m.box[3] = m.z + 1.5; });
  
  logs.forEach(L => { L.ang += L.w * dt; L.mesh.rotation.y = L.ang; });
  S.cool = Math.max(0, S.cool - dt); S.spike = Math.max(0, S.spike - dt);
  if (!S.seated){
    S.seat.obj.getWorldPosition(_sv);
    S.near = Math.hypot(noobStand.position.x - _sv.x, noobStand.position.z - _sv.z) < 9;
    const pr = $('prompt'); pr.style.display = 'block'; pr.classList.toggle('go', S.near);
    pr.textContent = S.near ? 'Press E to get in the seat' : 'Swim to your boat and press E next to the seat';
  } else $('prompt').style.display = 'none';
  if (S.fall > 0){ S.fvy += 30 * dt; S.fall -= S.fvy * dt; if (S.fall <= 0){ S.fall = 0; sfx('splash'); S.shake = Math.max(S.shake, .3); } }

  const fx = -Math.sin(S.yaw), fz = -Math.cos(S.yaw), lx = Math.cos(S.yaw), lz = -Math.sin(S.yaw);
  const cur = (Math.abs(S.x) < 26 && S.z < 280) ? CURRENT : 0; S.vz += cur;
  let vf = S.vx*fx + S.vz*fz, vl = S.vx*lx + S.vz*lz;
  const thr = !S.seated ? 0 : (keys.w ? 1 : 0) - (keys.s ? .5 : 0);
  const acc = S.eng ? thr * S.eng * 30 / S.mass * dev.speed : 0;
  vf += (acc - .5 * vf) * dt; vl *= Math.exp(-3 * dt);
  S.vx = fx*vf + lx*vl; S.vz = fz*vf + lz*vl - cur;
  if (S.z < FALL_TOP && S.z > FALL_TOP - FALL_LEN) S.vz -= 16 * dt;
  const steer = !S.seated ? 0 : (keys.a ? 1 : 0) - (keys.d ? 1 : 0);
  const turn = steer * S.turn * clamp(.25 + Math.abs(vf) / 7, 0, 1) * (vf < -.5 ? -1 : 1);
  S.yr += (turn - S.yr) * Math.min(1, dt * 6); S.yaw += S.yr * dt;
  const wp = dev.unlocked ? (dev.warp || 1) : 1; S.x += S.vx * dt * wp; S.z += S.vz * dt * wp; S.z = Math.max(S.z, END_Z + 2);
  collide(); updateBalls(dt);

  S.sy += (surfaceY(S.z) - S.sy) * Math.min(1, dt * 9);
  if (S.sy < -5 && !S.fell){ S.fell = true; sfx('splash'); S.shake = Math.max(S.shake, .9); toast('WATERFALL!', 'gold'); }
  boat.position.set(S.x, BOAT_Y + S.sy + S.fall + Math.sin(t * 2) * .06, S.z);
  boat.rotation.order = 'YXZ'; boat.rotation.set(Math.sin(t * 1.3) * .015 - Math.atan(slopeAt(S.z)) * .9, S.yaw, -S.yr * .1 + Math.sin(t * 1.7) * .015);
  engineGlow.color.setRGB(1, .35 + .4 * (thr > 0 ? 1 : 0), thr > 0 ? .05 : 0);

  wakeT -= dt; const sp = Math.hypot(S.vx, S.vz);
  if (wakeT <= 0 && sp > 2){ wakeT = .09; const w = wakes[wakeIdx++ % wakes.length]; w.life = 1;
    w.m.position.set(S.x - fx * S.R, WATER_Y + S.sy + .03, S.z - fz * S.R); w.m.visible = true; }
  wakes.forEach(w => { if (w.life > 0){ w.life -= dt * .6; w.m.scale.setScalar(1 + (1 - w.life) * 3); w.m.material.opacity = Math.max(0, w.life) * .5; if (w.life <= 0) w.m.visible = false; } });

  if (S.stage < CP.length && S.z < CP[S.stage]){ S.stage++; gold += 25; stageShown = S.stage; refresh(); toast('Checkpoint ' + S.stage + ' / ' + CP.length + '   +25 gold', S.stage % 6 === 0 || S.stage === CP.length ? 'good' : ''); if (S.stage % 6 !== 0 && S.stage !== CP.length) sfx('click'); }
  if (!S.chest && Math.hypot(S.x - CHEST.x, S.z - CHEST.z) < S.R + 4){ S.chest = true; gold += 100; stageShown = CP.length + 1; refresh(); toast('YOU FOUND THE TREASURE!  +100 gold', 'gold'); }

  const pct = clamp((START.z - S.z) / (START.z - CHEST.z) * 100, 0, 100);
  $('spd').textContent = Math.round(sp);
  { const mi = d => d * 0.28 / 1609.344; $('miles').textContent = mi(START.z - S.z).toFixed(2) + ' mi' + (S.stage < CP.length ? '  \u00b7  next checkpoint ' + mi(S.z - CP[S.stage]).toFixed(2) + ' mi' : '  \u00b7  treasure ' + mi(S.z - CHEST.z).toFixed(2) + ' mi'); }
  $('progFill').style.width = pct + '%'; $('boatDot').style.left = pct + '%';
  $('reload').style.width = (100 - S.cool / 1.1 * 100) + '%';
}

function decodeDesign(str){

    const a = s.split(','), type = BLOCK_KEYS[parseInt(a[3], 36)], x = +a[0], y = +a[1], z = +a[2];
    if (!type || ![x, y, z].every(Number.isInteger) || Math.abs(x) > 400 || Math.abs(z) > 400 || y < 0 || y > 30) return null;

}
